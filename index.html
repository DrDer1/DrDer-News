<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DrDer News</title>
<meta name="description" content="DrDer News - أخبار العالم مباشرة من مصادر موثوقة">
<meta name="theme-color" content="#0d0b08">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="192.png">
<link rel="apple-touch-icon" href="192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <h1 class="app-title">DrDer News</h1>
    <button id="refreshButton" class="refresh-button" type="button" aria-label="تحديث الأخبار">
      <span class="refresh-icon" aria-hidden="true"></span>
      <span class="refresh-label">تحديث</span>
    </button>
  </div>
  <div id="statusBar" class="status-bar" role="status" aria-live="polite"></div>
</header>

<main id="newsContainer" class="news-container" aria-live="polite">
  <div id="emptyState" class="empty-state" hidden>
    <p>لا توجد أخبار متاحة حاليًا.</p>
  </div>
  <div id="loadingState" class="loading-state">
    <p>جاري تحميل الأخبار...</p>
  </div>
  <div id="newsList" class="news-list"></div>
</main>

<div id="adSlotBottom" class="ad-slot ad-slot-bottom" aria-hidden="true"></div>

<template id="newsCardTemplate">
  <article class="news-card">
    <a class="news-card-image-link" href="#" target="_blank" rel="noopener noreferrer">
      <img class="news-card-image" src="" alt="" loading="lazy">
    </a>
    <div class="news-card-body">
      <div class="news-card-meta">
        <span class="news-card-source"></span>
        <span class="news-card-time"></span>
      </div>
      <h2 class="news-card-title"></h2>
      <p class="news-card-summary"></p>
      <a class="news-card-link" href="#" target="_blank" rel="noopener noreferrer">قراءة الخبر كاملاً</a>
    </div>
  </article>
</template>

<script src="sources.js" defer></script>
<script src="news.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
